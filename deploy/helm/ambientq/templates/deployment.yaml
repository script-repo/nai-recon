{{- if include "ambientq.sqlitePVC" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ambientq.name" . }}-data
  labels: {{- include "ambientq.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ambientq.name" . }}
  labels: {{- include "ambientq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}   # SQLite: single writer. Use Postgres before scaling out.
  strategy: {{ if include "ambientq.sqlitePVC" . }}{type: Recreate}{{ else }}{type: RollingUpdate}{{ end }}
  selector:
    matchLabels: {{- include "ambientq.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ambientq.selector" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "ambientq.scheduling" . | nindent 6 }}
      initContainers: {{- include "ambientq.gitInit" . | nindent 8 }}
      containers:
        - name: ambientq
          image: {{ include "ambientq.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env: {{- include "ambientq.env" . | nindent 12 }}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: {{- include "ambientq.volumeMounts" . | nindent 12 }}
      volumes: {{- include "ambientq.volumes" . | nindent 8 }}
