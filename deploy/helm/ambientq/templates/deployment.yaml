{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ambientq.name" . }}-data
  labels: {{- include "ambientq.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ambientq.name" . }}
  labels: {{- include "ambientq.labels" . | nindent 4 }}
spec:
  replicas: 1   # SQLite: single writer. Use Postgres before scaling out.
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "ambientq.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ambientq.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 10001}
      initContainers: {{- include "ambientq.gitInit" . | nindent 8 }}
      containers:
        - name: ambientq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env: {{- include "ambientq.env" . | nindent 12 }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "ambientq.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/ambientq/ambientq.yaml, subPath: ambientq.yaml}
            - {name: data, mountPath: /data}
            - {name: harness, mountPath: /harness}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.nai.caConfigMap }}
            - {name: ca, mountPath: /etc/ambientq/ca}
            {{- end }}
      volumes:
        - {name: config, configMap: {name: {{ include "ambientq.name" . }}}}
        {{- if .Values.persistence.enabled }}
        - {name: data, persistentVolumeClaim: {claimName: {{ include "ambientq.name" . }}-data}}
        {{- else }}
        - {name: data, emptyDir: {}}
        {{- end }}
        - {name: harness, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        {{- if .Values.nai.caConfigMap }}
        - {name: ca, configMap: {name: {{ .Values.nai.caConfigMap }}}}
        {{- end }}
