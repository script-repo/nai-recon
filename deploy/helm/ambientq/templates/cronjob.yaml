{{- if .Values.schedule.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ambientq.name" . }}-evaluate
  labels: {{- include "ambientq.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule.cron | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {{- include "ambientq.selector" . | nindent 12 }}
            app.kubernetes.io/component: evaluate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- include "ambientq.scheduling" . | nindent 10 }}
          {{- if include "ambientq.sqlitePVC" . }}
          # Shares the SQLite volume with the server pod (RWO): schedule on the same node, or use Postgres.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {{- include "ambientq.selector" . | nindent 22 }}
                      app.kubernetes.io/component: server
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          initContainers: {{- include "ambientq.gitInit" . | nindent 12 }}
          containers:
            - name: evaluate
              image: {{ include "ambientq.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["evaluate", "--trigger", "schedule"]
              env: {{- include "ambientq.env" . | nindent 16 }}
              resources: {{- toYaml .Values.resources | nindent 16 }}
              securityContext: {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts: {{- include "ambientq.volumeMounts" . | nindent 16 }}
          volumes: {{- include "ambientq.volumes" . | nindent 12 }}
{{- end }}
