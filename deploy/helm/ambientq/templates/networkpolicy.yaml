{{- if .Values.networkPolicy.enabled }}
# Sovereignty guardrail: ambientq may only talk to DNS and the CIDRs you list (NAI, git).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ambientq.name" . }}
  labels: {{- include "ambientq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ambientq.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
    {{- end }}
{{- end }}
