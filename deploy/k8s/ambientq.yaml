# Rendered from deploy/helm/ambientq with default values:
#   helm template ambientq deploy/helm/ambientq --set harness.repo=https://git.example.local/ai/nkp-ops-agent.git
# Prefer the chart (auth, alerts, Ingress, Postgres are values there). Before applying this file:
# create the NAI key Secret, set the NAI URL/model in the ConfigMap, and allow the NAI endpoint
# (and your git server) in the NetworkPolicy egress.
#   kubectl create namespace ai-quality
#   kubectl -n ai-quality create secret generic nai-judge-key --from-literal=apiKey=<NAI endpoint API key>
#   kubectl -n ai-quality apply -f deploy/k8s/ambientq.yaml
---
# Sovereignty guardrail: ambientq may only talk to DNS and the CIDRs you list (NAI, git).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ambientq-ambientq
  labels:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
    app.kubernetes.io/version: "0.2.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ambientq
      app.kubernetes.io/instance: ambientq
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambientq-ambientq
  labels:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
    app.kubernetes.io/version: "0.2.0"
data:
  # No secrets here: every *_env key names an env var filled from a Secret.
  ambientq.yaml: |
    store: {url: "sqlite:////data/ambientq.db"}
    harness: {path: "/harness/repo/harness"}
    llm:
      base_url: "https://nai.example.local/api/v1"
      api_key_env: NAI_API_KEY
      model: "llama-3-1-70b-judge"
      verifier_model: null
    replay:
      model: null
      control_sample: 2
      enabled: true
      max_conversations: 5
      max_steps: 8
      mode: multi
      unmatched: nearest
    server: {host: 0.0.0.0, port: 8080, ingest_token_env: AMBIENTQ_INGEST_TOKEN}
    budget:
      max_conversations_per_run: 200
      max_tokens_per_run: 400000
    gateway:
      mappings: {}
      session_fields: []
    insights:
      resolve_after_runs: 2
      similarity: 0.5
    judge:
      max_findings: 8
      min_confidence: 0.5
    sampling:
      max_priority: 50
      rate: 0.2
      seed: ambientq
    verifier:
      enabled: true
      llm: true
    agents: []
    teams:
      default: default
    shadow:
      enabled: false
      limit: 20
      since: 24h
    pricing:
      currency: USD
      default:
        input_per_1k: 0
        output_per_1k: 0
      models: {}
    alerts:
      min_severity: "high"
      on_regression: true
      webhooks: []
    forge:
      kind: null
      api_url: null
      repo: null
      token_env: FORGE_TOKEN
      base_branch: "main"
    auth:
      mode: "none"
      session_secret_env: AMBIENTQ_SESSION_SECRET
      session_ttl_s: 28800
      cookie_insecure: false
      public_url: null
      oidc:
        issuer: null
        client_id: null
        client_secret_env: AMBIENTQ_OIDC_CLIENT_SECRET
        scopes: "openid email profile"
        groups_claim: "groups"
      proxy:
        user_header: "X-Forwarded-User"
        email_header: "X-Forwarded-Email"
        groups_header: "X-Forwarded-Groups"
        trusted_proxies:
          - 127.0.0.1/32
          - ::1/128
      roles:
        admin: []
        approver: []
        viewer:
        - '*'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ambientq-ambientq-data
  labels:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
    app.kubernetes.io/version: "0.2.0"
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ambientq-ambientq
  labels:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
    app.kubernetes.io/version: "0.2.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambientq-ambientq
  labels:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 1   # SQLite: single writer. Use Postgres before scaling out.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: ambientq
      app.kubernetes.io/instance: ambientq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ambientq
        app.kubernetes.io/instance: ambientq
        app.kubernetes.io/component: server
      annotations:
        checksum/config: 4fbbc9d06ed7deea20e5c326de392c917d44b1a47d3406e3e6055bcbd468b625
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:

        - name: harness
          image: "ghcr.io/script-repo/ambientq:0.2.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              URL="https://git.example.local/ai/nkp-ops-agent.git"
              if [ -n "$GIT_TOKEN" ]; then URL=$(echo "$URL" | sed "s#https://#https://x-access-token:${GIT_TOKEN}@#"); fi
              rm -rf /harness/repo && git clone --depth 50 --branch main "$URL" /harness/repo
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: harness, mountPath: /harness}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: ambientq
          image: "ghcr.io/script-repo/ambientq:0.2.0"
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          env:
            - name: AMBIENTQ_CONFIG
              value: /etc/ambientq/ambientq.yaml
            - name: NAI_API_KEY
              valueFrom: {secretKeyRef: {name: nai-judge-key, key: apiKey}}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/ambientq/ambientq.yaml, subPath: ambientq.yaml}
            - {name: data, mountPath: /data}
            - {name: harness, mountPath: /harness}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: ambientq-ambientq}}
        - {name: data, persistentVolumeClaim: {claimName: ambientq-ambientq-data}}
        - {name: harness, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ambientq-ambientq-evaluate
  labels:
    app.kubernetes.io/name: ambientq
    app.kubernetes.io/instance: ambientq
    app.kubernetes.io/version: "0.2.0"
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ambientq
            app.kubernetes.io/instance: ambientq
            app.kubernetes.io/component: evaluate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault

          # Shares the SQLite volume with the server pod (RWO): schedule on the same node, or use Postgres.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ambientq
                      app.kubernetes.io/instance: ambientq
                      app.kubernetes.io/component: server
                  topologyKey: kubernetes.io/hostname
          initContainers:

            - name: harness
              image: "ghcr.io/script-repo/ambientq:0.2.0"
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  URL="https://git.example.local/ai/nkp-ops-agent.git"
                  if [ -n "$GIT_TOKEN" ]; then URL=$(echo "$URL" | sed "s#https://#https://x-access-token:${GIT_TOKEN}@#"); fi
                  rm -rf /harness/repo && git clone --depth 50 --branch main "$URL" /harness/repo
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - {name: harness, mountPath: /harness}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: evaluate
              image: "ghcr.io/script-repo/ambientq:0.2.0"
              imagePullPolicy: IfNotPresent
              args: ["evaluate", "--trigger", "schedule"]
              env:
                - name: AMBIENTQ_CONFIG
                  value: /etc/ambientq/ambientq.yaml
                - name: NAI_API_KEY
                  valueFrom: {secretKeyRef: {name: nai-judge-key, key: apiKey}}
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - {name: config, mountPath: /etc/ambientq/ambientq.yaml, subPath: ambientq.yaml}
                - {name: data, mountPath: /data}
                - {name: harness, mountPath: /harness}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: config, configMap: {name: ambientq-ambientq}}
            - {name: data, persistentVolumeClaim: {claimName: ambientq-ambientq-data}}
            - {name: harness, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
