name: ci
on:
  push:
    branches: [main, ambientq]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q
      - name: demo smoke test
        run: ambientq demo --workdir /tmp/demo --http
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ambientq
          POSTGRES_PASSWORD: ambientq
          POSTGRES_DB: ambientq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ambientq -d ambientq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials of the CI service container, not a secret.
      AMBIENTQ_TEST_PG_URL: postgresql://ambientq:ambientq@localhost:5432/ambientq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - name: tests, including tests/test_postgres.py against the service container
        run: pytest -q -rs
      - name: demo end to end on PostgreSQL
        env:
          AMBIENTQ_STORE_URL: postgresql://ambientq:ambientq@localhost:5432/ambientq
        run: ambientq demo --workdir /tmp/demo-pg --http
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: helm lint deploy/helm/ambientq
      - run: helm lint deploy/helm/ambientq -f deploy/helm/ambientq/ci/full-values.yaml
      - run: helm lint deploy/helm/ambientq -f deploy/helm/ambientq/ci/proxy-values.yaml
      - name: helm template (defaults, auth+ingress+alerts+postgres, oauth2-proxy)
        run: |
          helm template t deploy/helm/ambientq > /dev/null
          helm template t deploy/helm/ambientq --set harness.repo=https://example.invalid/r.git > /dev/null
          helm template t deploy/helm/ambientq -f deploy/helm/ambientq/ci/full-values.yaml > /dev/null
          helm template t deploy/helm/ambientq -f deploy/helm/ambientq/ci/proxy-values.yaml > /dev/null
      - name: rendered config loads in ambientq; secrets only via secretKeyRef
        run: |
          pip install -e ".[dev]"
          pytest -q -rs tests/test_helm.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=ci --build-arg REVISION=${{ github.sha }} -t ambientq:ci .
      - run: docker run --rm ambientq:ci --version
      - name: runs as non-root uid 10001
        run: test "$(docker run --rm --entrypoint id ambientq:ci -u)" = "10001"
