# Release: build the image for amd64 + arm64, push it to GHCR, generate an SPDX SBOM
# with syft, sign the image and attest the SBOM keylessly with cosign (GitHub OIDC),
# then verify both. Runs only on version tags (v*) or by hand, never on ordinary pushes.
# How to cut a release and verify it: docs/RELEASE.md.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0. Empty: build the selected ref, tagged by commit sha only."
        required: false
        default: ""
permissions:
  contents: read
  packages: write
  id-token: write      # keyless cosign signing and GitHub attestations
  attestations: write
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Warn when a tag is built from a branch run
        if: inputs.tag != '' && github.ref != format('refs/tags/{0}', inputs.tag)
        run: >-
          echo "::warning::building ${{ inputs.tag }} from ${{ github.ref }}: the signature identity will be
          ${{ github.ref }}, not refs/tags/${{ inputs.tag }}. For a release, run the workflow from the tag."

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ambientq" >> "$GITHUB_ENV"

      - name: Tag matches the package version
        if: env.TAG != ''
        run: |
          want="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          chart="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/ambientq/Chart.yaml)"
          test "${TAG#v}" = "$want" || { echo "::error::tag $TAG != pyproject version $want"; exit 1; }
          test "${TAG#v}" = "$chart" || { echo "::error::tag $TAG != chart appVersion $chart"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ambientq
            org.opencontainers.image.source=https://github.com/script-repo/nai-recon

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (SPDX JSON, syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: ambientq-sbom-${{ env.TAG || github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image and attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Verify signature and SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" \
            "${IMAGE}@${DIGEST}" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" "${IMAGE}@${DIGEST}" > /dev/null
          {
            echo "### ambientq image"
            echo
            echo "- image: \`${IMAGE}@${DIGEST}\`"
            echo "- tags: $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')"
            echo "- signature and SPDX SBOM attestation verified (keyless, GitHub OIDC)"
          } >> "$GITHUB_STEP_SUMMARY"
